# Entreprises suivies par FinTrack.
#
# Sources de la liste :
#   - les 50 entreprises qui publient le plus d'offres sur fyntraq.io/companies (classement public, 11/11/2026)
#   - les listes Wikipédia des banques d'investissement, fonds de private equity, hedge funds et sociétés
#     de gestion, croisées avec les jeux de données publics (licence MIT) qui associent ~38 000 entreprises
#     à leur identifiant Greenhouse / Lever / Ashby / Workday :
#       github.com/Feashliaa/job-board-aggregator  et  github.com/ConorsCode/open-jobs-data
#   - quelques boutiques, fonds et sociétés de trading ajoutés à la main
#
# Chaque entreprise a soit :
#   - un connecteur explicite (`ats:` + paramètres), soit
#   - seulement `careers:` (URL de la page carrières) → la plateforme est détectée automatiquement
#     au premier passage, puis mémorisée dans scraper/resolved.json.
# Si un connecteur explicite échoue et que `careers:` est renseigné, la détection prend le relais.
#
# Types d'entreprise (mêmes catégories que Fyntraq) :
#   Bulge Bracket | Elite Boutique | Middle Market | Corporate & Investment Bank | Private Equity |
#   Asset Management | Advisory & Audit | Real Estate
#
# verified: true = point d'accès vérifié le 10-11/11/2026.

defaults:
  search: [intern, internship, analyst, graduate, associate, trader, stage, stagiaire, VIE, alternance, apprentice, summer, off-cycle, spring]

