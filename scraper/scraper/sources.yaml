# Business France — l'API des offres VIE exige désormais une authentification (erreur 401 au 12/11/2026).
# Les VIE arrivent via les sites carrières, Welcome to the Jungle et Jobteaser.
vie_businessfrance: false

# Agrégateurs : lus via leurs sitemaps publics (offres des entreprises suivies + postes front office des autres)
