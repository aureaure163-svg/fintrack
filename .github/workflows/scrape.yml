name: Collecte des offres

on:
  schedule:
    - cron: "17 */2 * * *"   # toutes les 2 heures
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]
    paths: ["scraper/**", "site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collecter
        run: python scraper/scrape.py
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      - name: Enregistrer les données
        run: |
          git config user.name "fintrack-bot"
          git config user.email "fintrack-bot@users.noreply.github.com"
          git add site/data scraper/resolved_v2.json
          git diff --cached --quiet || git commit -m "data: mise à jour $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
